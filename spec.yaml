schemaVersion: "1"
kind: mixin
name: openhands
displayName: OpenHands CLI (Anthropic / Claude)
description: "Installs the OpenHands V1 coding-agent CLI (openhands) into a sandbox and wires it to Anthropic Claude via LiteLLM. The kit holds no key: store it once with `sbx secret set-custom --host api.anthropic.com --env LLM_API_KEY --value \"$ANTHROPIC_API_KEY\"` and the sbx proxy injects it as the x-api-key header on requests to api.anthropic.com. Run it in-sandbox with `openhands --override-with-envs`."
sourceURL: https://github.com/ajeetraina/sbx-kits-openhands

network:
  allowedDomains:
    - pypi.org                        # uv + its dependencies
    - files.pythonhosted.org
    - github.com                      # uv-managed CPython 3.12 (python-build-standalone)
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - astral.sh                       # uv metadata
    - api.anthropic.com               # Claude, reached by OpenHands via LiteLLM
  # OpenHands sends the LLM key to Anthropic as `x-api-key: <LLM_API_KEY>`.
  # The proxy overwrites that header with the real key stored via
  # `sbx secret set-custom` (keyed on api.anthropic.com), so the key never
  # enters the sandbox. `llm` is just a local service label for this kit.
  serviceDomains:
    api.anthropic.com: llm
  serviceAuth:
    llm:
      headerName: x-api-key
      valueFormat: "%s"

environment:
  variables:
    # uv installs the `openhands` bin under ~/.local/bin — put it on PATH.
    PATH: "/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # LiteLLM-style model string. Anthropic-context default is Claude Opus 4.8;
    # swap for anthropic/claude-sonnet-4-6 for a cheaper/faster coding loop.
    LLM_MODEL: "anthropic/claude-opus-4-8"
    # Placeholder so LiteLLM has a non-empty key to send; the proxy swaps it on
    # the wire for api.anthropic.com. The real key is stored out-of-band with
    # `sbx secret set-custom --env LLM_API_KEY` (see the README).
    LLM_API_KEY: "placeholder"
    OPENHANDS_SUPPRESS_BANNER: "1"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

commands:
  install:
    - command: "pip install --break-system-packages 'uv>=0.11.6'"
      user: "0"
      description: "Install uv (used to install the OpenHands CLI on Python 3.12)"
    - command: "uv tool install openhands --python 3.12"
      user: "1000"
      description: "Install the OpenHands V1 CLI (bin: openhands) into ~/.local/bin"

memory: |
  ## OpenHands coding-agent CLI (Anthropic / Claude)

  The OpenHands V1 CLI is installed on PATH as `openhands` (via `uv tool
  install openhands`) and wired to Anthropic Claude through LiteLLM. The model
  is set in `LLM_MODEL` (default `anthropic/claude-opus-4-8`).

  OpenHands ignores the `LLM_*` environment variables unless you pass
  `--override-with-envs`, so run it as:

      openhands --override-with-envs                       # interactive TUI
      openhands --headless --override-with-envs --exit-without-confirmation -t "…"

  No key lives in the sandbox: `LLM_API_KEY` is a placeholder, and the sbx
  proxy overwrites the `x-api-key` header with the real Anthropic key (stored
  via `sbx secret set-custom --host api.anthropic.com --env LLM_API_KEY`) on
  outbound requests to api.anthropic.com. If OpenHands reports an auth error,
  confirm the secret is stored (`sbx secret ls`). A one-shot smoke test lives
  at `~/runbooks/smoke.sh`.
