schemaVersion: "2"
kind: mixin
name: openhands
displayName: OpenHands Agent Canvas (OpenAI)
description: "Installs OpenHands Agent Canvas — the browser UI + backend server (`agent-canvas`, port 8000) that replaced the deprecated interactive CLI — plus the still-supported headless `openhands` runner, wired to OpenAI via LiteLLM. The kit holds no key: OpenAI is a built-in sbx service, so store your key once with `sbx secret set openai` and the proxy injects it as a Bearer token on requests to api.openai.com. Forward port 8000 (`sbx run -p 8000 …`) and open http://localhost:8000, or run the headless smoke test."
sourceURL: https://github.com/ajeetraina/sbx-kits-openhands

permissions:
  network:
    allow:
      - pypi.org                        # uv + its dependencies
      - files.pythonhosted.org
      - github.com                      # uv-managed CPython 3.12 (python-build-standalone)
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - astral.sh                       # uv metadata
      - nodejs.org                      # Node.js 22 runtime (static tarball)
      - registry.npmjs.org              # @openhands/agent-canvas (npm)
      - ghcr.io                         # Canvas agent-server image/artifacts
      - pkg-containers.githubusercontent.com   # ghcr blob storage
      - api.openai.com                  # OpenAI, reached by OpenHands via LiteLLM

# api.openai.com is a BUILT-IN sbx service. Store your key once with
# `sbx secret set openai` (or `sbx secret set openai --oauth`) and the proxy
# injects `Authorization: Bearer <key>` on requests to api.openai.com — no
# per-kit custom secret needed. v2 requires this injection to be declared
# explicitly (it is no longer inferred from the allow-list), hence the
# credentials block below. OpenHands sends `Authorization: Bearer
# <LLM_API_KEY>`; the proxy overwrites that header with the real key on the
# wire, so LLM_API_KEY stays a placeholder and never holds a real secret.
credentials:
  - service: openai
    description: "OpenAI API key for OpenHands (via LiteLLM)"
    apiKey:
      name: LLM_API_KEY
      proxyManaged: true
      inject:
        - domain: api.openai.com
          scheme: bearer

environment:
  variables:
    PATH: "/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # LiteLLM-style model string; swap for any OpenAI chat model you have access to.
    LLM_MODEL: "openai/gpt-4o"
    # Placeholder so LiteLLM has a non-empty key to send; the proxy swaps it on
    # the wire for api.openai.com. Real key: `sbx secret set openai`.
    LLM_API_KEY: "placeholder"
    OPENHANDS_SUPPRESS_BANNER: "1"
    # Encrypts Agent Canvas' stored settings under ~/.openhands. Fixed dev value
    # so the local, single-user sandbox backend starts without prompting; the
    # LLM key it protects is only ever the placeholder above.
    OH_SECRET_KEY: "sbx-openhands-dev"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

setup:
  install:
    - command: 'bash -lc ''set -e; A=$(uname -m); case "$A" in x86_64) N=x64;; aarch64|arm64) N=arm64;; *) echo "unsupported arch: $A" >&2; exit 1;; esac; V=v22.12.0; curl -fsSL "https://nodejs.org/dist/$V/node-$V-linux-$N.tar.xz" | tar -xJ -C /usr/local --strip-components=1'''
      user: "0"
      description: "Install Node.js 22 (static tarball into /usr/local) for Agent Canvas"
    - command: "npm install -g @openhands/agent-canvas"
      user: "0"
      description: "Install OpenHands Agent Canvas (bin: agent-canvas) globally"
    - command: "pip install --break-system-packages 'uv>=0.11.6'"
      user: "0"
      description: "Install uv (used to install the headless OpenHands runner on Python 3.12)"
    - command: "uv tool install openhands --python 3.12"
      user: "1000"
      description: "Install the headless OpenHands runner (bin: openhands) into ~/.local/bin"

agentInstructions:
  content: |
    ## OpenHands Agent Canvas (OpenAI)

    OpenHands' interactive CLI/TUI is deprecated in favour of **Agent Canvas**, a
    browser UI + backend server. This kit installs both surfaces, wired to OpenAI
    through LiteLLM. The model is set in `LLM_MODEL` (default `openai/gpt-4o`);
    the agent reads `LLM_MODEL` / `LLM_API_KEY` from the environment on startup.

    **Agent Canvas (primary, interactive)** — installed on PATH as
    `agent-canvas` (via `npm i -g @openhands/agent-canvas`). Start the server and
    open it in a browser:

        agent-canvas                     # serves http://localhost:8000

    Port 8000 must be forwarded to the host — start the sandbox with
    `sbx run -p 8000 …` (or add a forward), then open http://localhost:8000. A
    launcher lives at `~/runbooks/canvas.sh`.

    **Headless runner (automation / verification)** — the still-supported
    `openhands` binary (via `uv tool install openhands`). It ignores the `LLM_*`
    env vars unless you pass `--override-with-envs`:

        openhands --headless --override-with-envs --exit-without-confirmation -t "…"

    No key lives in the sandbox: `LLM_API_KEY` is a placeholder, and the sbx
    proxy overwrites the `Authorization: Bearer …` header with the real OpenAI
    key on outbound requests to api.openai.com. OpenAI is a built-in sbx service,
    so store the key once on the host with `sbx secret set openai` (or
    `sbx secret set openai --oauth`) — no per-kit custom secret needed. A one-shot
    smoke test lives at `~/runbooks/smoke.sh`.
