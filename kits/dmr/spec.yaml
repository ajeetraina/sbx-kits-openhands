schemaVersion: "1"
kind: mixin
name: openhands
displayName: OpenHands CLI (Docker Model Runner)
description: "Installs the OpenHands V1 coding-agent CLI (openhands) into a sandbox and wires it to a local Docker Model Runner over host.docker.internal:12434 — no cloud key, no external LLM. Pull a coding model on the host first (e.g. `docker model pull ai/qwen2.5-coder`). Run it in-sandbox with `openhands --override-with-envs`."
sourceURL: https://github.com/ajeetraina/sbx-kits-openhands

network:
  allowedDomains:
    - pypi.org                        # uv + its dependencies
    - files.pythonhosted.org
    - github.com                      # uv-managed CPython 3.12 (python-build-standalone)
    - objects.githubusercontent.com
    - release-assets.githubusercontent.com
    - astral.sh                       # uv metadata
    - host.docker.internal:12434      # Docker Model Runner on the host

environment:
  variables:
    PATH: "/home/agent/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    # DMR exposes an OpenAI-compatible endpoint, so route it through LiteLLM's
    # openai/ provider pointed at LLM_BASE_URL. Change the model to whatever you
    # pulled on the host (`docker model ls`).
    LLM_MODEL: "openai/ai/qwen2.5-coder"
    LLM_BASE_URL: "http://host.docker.internal:12434/engines/v1"
    LLM_API_KEY: "dmr"                # DMR ignores the key; any non-empty string works
    OPENHANDS_SUPPRESS_BANNER: "1"
    NO_PROXY: "localhost,127.0.0.1,host.docker.internal"
    no_proxy: "localhost,127.0.0.1,host.docker.internal"

commands:
  install:
    - command: "pip install --break-system-packages 'uv>=0.11.6'"
      user: "0"
      description: "Install uv (used to install the OpenHands CLI on Python 3.12)"
    - command: "uv tool install openhands --python 3.12"
      user: "1000"
      description: "Install the OpenHands V1 CLI (bin: openhands) into ~/.local/bin"

memory: |
  ## OpenHands coding-agent CLI (Docker Model Runner)

  The OpenHands V1 CLI is installed on PATH as `openhands` (via `uv tool
  install openhands`) and wired to a local Docker Model Runner over
  `http://host.docker.internal:12434/engines/v1` — no cloud credentials. The
  model is `LLM_MODEL` (default `openai/ai/qwen2.5-coder`); it must be pulled on
  the host first with `docker model pull ai/qwen2.5-coder`.

  OpenHands ignores the `LLM_*` environment variables unless you pass
  `--override-with-envs`, so run it as:

      openhands --override-with-envs                       # interactive TUI
      openhands --headless --override-with-envs --exit-without-confirmation -t "…"

  If OpenHands can't reach the model, confirm DMR is running on the host
  (`docker model ls`) and that the model in `LLM_MODEL` is pulled. A one-shot
  smoke test lives at `~/runbooks/smoke.sh`.
