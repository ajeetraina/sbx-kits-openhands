<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3af"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#ffffff"/>

  <!-- Host machine -->
  <rect x="28" y="40" width="945" height="628" rx="26" fill="#e9f1fc" stroke="#7aa7e0" stroke-width="2.5"/>
  <text x="62" y="642" fill="#1e4fa3" font-size="21" font-weight="700">Host machine</text>

  <!-- Workspace directories -->
  <rect x="66" y="232" width="152" height="82" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="142" y="266" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Workspace</text>
  <text x="142" y="288" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">directories</text>
  <line x1="218" y1="273" x2="272" y2="273" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Browser (Agent Canvas UI) on host -->
  <rect x="66" y="470" width="196" height="86" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="164" y="502" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Browser  :8000</text>
  <text x="164" y="524" text-anchor="middle" fill="#6b7280" font-size="13">Agent Canvas UI</text>
  <text x="164" y="542" text-anchor="middle" fill="#6b7280" font-size="12">localhost:8000</text>

  <!-- microVM sandbox -->
  <rect x="278" y="118" width="262" height="352" rx="13" fill="#ffffff" stroke="#6b7787" stroke-width="2"/>
  <text x="298" y="150" fill="#1f2937" font-size="18" font-weight="700">microVM sandbox</text>
  <text x="522" y="150" text-anchor="end" fill="#8a94a6" font-size="13">container</text>

  <!-- container dashed box -->
  <rect x="298" y="166" width="222" height="176" rx="9" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Agent / Claude -->
  <rect x="314" y="182" width="190" height="56" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="216" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">Agent / Claude</text>

  <!-- openhands mixin -->
  <rect x="314" y="254" width="190" height="74" rx="7" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="409" y="280" text-anchor="middle" fill="#2f6fdb" font-size="16" font-weight="700">openhands</text>
  <text x="409" y="299" text-anchor="middle" fill="#6b7280" font-size="11.5">Agent Canvas + headless</text>
  <text x="409" y="316" text-anchor="middle" fill="#6b7280" font-size="11.5">kind: mixin</text>

  <!-- LLM_API_KEY -->
  <rect x="298" y="356" width="222" height="72" rx="9" fill="#ece7dd" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="409" y="388" text-anchor="middle" fill="#6b6255" font-size="14" font-weight="600" font-family="'SF Mono', Menlo, monospace">LLM_API_KEY</text>
  <text x="409" y="409" text-anchor="middle" fill="#8a8272" font-size="13">= proxy-managed</text>

  <!-- port-forward: sandbox -> browser -->
  <path d="M300 430 C 250 452, 210 458, 170 470" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="196" y="452" text-anchor="middle" fill="#6b7280" font-size="12">-p 8000 forward</text>

  <!-- sandbox -> proxy -->
  <line x1="540" y1="283" x2="596" y2="283" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Secret store -->
  <rect x="596" y="146" width="182" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="687" y="178" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Secret store</text>
  <text x="687" y="200" text-anchor="middle" fill="#6b7280" font-size="12.5">sbx secret set openai</text>
  <line x1="687" y1="220" x2="687" y2="256" stroke="#8a94a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sbx proxy -->
  <rect x="596" y="258" width="182" height="78" rx="9" fill="#d9f2e4" stroke="#86d6ab" stroke-width="2"/>
  <text x="687" y="292" text-anchor="middle" fill="#1f9d63" font-size="17" font-weight="700">sbx proxy</text>
  <text x="687" y="314" text-anchor="middle" fill="#1f9d63" font-size="13">swaps in key</text>

  <!-- Egress policy -->
  <rect x="596" y="360" width="182" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="687" y="392" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">Egress policy</text>
  <text x="687" y="414" text-anchor="middle" fill="#6b7280" font-size="12.5">allow-list</text>

  <!-- proxy -> LLM API (crosses host boundary) -->
  <path d="M778 290 C 900 280, 930 250, 992 236" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>
  <!-- egress -> registries -->
  <path d="M778 400 C 900 405, 930 400, 992 392" fill="none" stroke="#9aa3af" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowDash)"/>

  <!-- LLM API (external) -->
  <rect x="992" y="200" width="176" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="232" text-anchor="middle" fill="#1f2937" font-size="16" font-weight="700">LLM API</text>
  <text x="1080" y="254" text-anchor="middle" fill="#6b7280" font-size="12.5">api.openai.com</text>

  <!-- Registries (external) -->
  <rect x="992" y="356" width="176" height="74" rx="9" fill="#ffffff" stroke="#cfd6df" stroke-width="1.5"/>
  <text x="1080" y="386" text-anchor="middle" fill="#1f2937" font-size="15" font-weight="700">PyPI · npm · Node</text>
  <text x="1080" y="408" text-anchor="middle" fill="#6b7280" font-size="12.5">install-time only</text>

  <!-- caption -->
  <text x="992" y="486" fill="#1e4fa3" font-size="16" font-weight="700">The LLM key never</text>
  <text x="992" y="508" fill="#1e4fa3" font-size="16" font-weight="700">enters the sandbox</text>
  <text x="992" y="536" fill="#3b7fd6" font-size="13.5">Proxy swaps it in at</text>
  <text x="992" y="555" fill="#3b7fd6" font-size="13.5">the network boundary</text>
</svg>
